<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — CWDEV</title>
  <meta name="description" content="Contactez CWDEV pour créer un site web moderne, rapide et optimisé SEO." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <a href="index.html" class="brand" aria-label="CWDEV accueil">
      <img src="assets/logo.png" alt="Logo CWDEV" />
    </a>
  
    <nav class="nav">
      <a href="index.html#services">Services</a>
      <a href="index.html#processus">Processus</a>
      <a href="index.html#contact">Contact</a>
      <a href="expertise.html">Expertise</a>
    </nav>
  
    <a href="contact.html" class="btn btn-primary">Consultation gratuite</a>
  </header>

  <main class="contact-page">
    <section class="contact-hero">
      <p class="eyebrow">Contact</p>
      <h1>Parlons de votre projet.</h1>
      <p>
        Vous voulez un site web propre, moderne et crédible ? Remplissez le formulaire,
        nous vous répondons rapidement avec une proposition claire.
      </p>
    </section>

    <section class="contact-section">
      <form 
        class="contact-form" 
        action="https://formspree.io/f/mlgavlav"
        method="POST"
      >
      <input type="hidden" name="_redirect" value="https://69ee38e59f987222050886a9--thunderous-peony-4fce44.netlify.app/merci.html">
        <div class="form-group">
          <label for="name">Nom complet</label>
          <input type="text" id="name" name="name" placeholder="Votre nom" required>
        </div>

        <div class="form-group">
          <label for="email">Adresse courriel</label>
          <input type="email" id="email" name="email" placeholder="exemple@email.com" required>
        </div>

        <div class="form-group">
          <label for="business">Nom de l’entreprise</label>
          <input type="text" id="business" name="business" placeholder="Nom de votre entreprise">
        </div>

        <div class="form-group">
          <label for="service">Type de projet</label>
          <select id="service" name="service" required>
            <option value="">Choisir une option</option>
            <option value="site-vitrine">Site vitrine</option>
            <option value="refonte">Refonte de site</option>
            <option value="seo">Optimisation SEO</option>
            <option value="reservation">Site avec réservation</option>
            <option value="autre">Autre</option>
          </select>
        </div>

        <div class="form-group">
          <label for="budget">Budget approximatif</label>
          <select id="budget" name="budget">
            <option value="">Choisir une option</option>
            <option value="moins-1000">Moins de 1000$</option>
            <option value="1000-2500">1000$ – 2500$</option>
            <option value="2500-5000">2500$ – 5000$</option>
            <option value="5000-plus">5000$ et plus</option>
          </select>
        </div>

        <div class="form-group full">
          <label for="message">Décrivez votre projet</label>
          <textarea id="message" name="message" rows="6" placeholder="Parlez-moi de votre besoin, votre site actuel, vos objectifs..." required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Envoyer la demande</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 CWDEV</p>
  </footer>

</body>
</html>
